server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json font/ttf;
    gzip_min_length 1024;

    # Vite's content-hashed build output is immutable, so cache it for a year.
    # Keep files with stable names out of /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Icons and logos keep their file names across releases, so cache them for a
    # day: a regenerated icon reaches browsers and the CDN within a day.
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker, registration shim, manifest, and the HTML entry must always
    # revalidate so updates roll out promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
