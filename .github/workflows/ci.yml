name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Validates the Dockerfile/nginx layering. Build args are placeholders —
      # the image isn't pushed, so the baked-in values don't matter here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=pk_test_ci
            VITE_API_BASE_URL=https://example.com
