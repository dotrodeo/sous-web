# Self-hosted deploy: static PWA (nginx) + bundled Cloudflare Tunnel, one stack
# per environment (dev/prod side by side; names suffixed with ${ENV}):
#   cp .env.deploy.example .env.dev        # set VITE_*, TUNNEL_TOKEN, WEB_PORT, ENV
#   npm run deploy dev                     # or: docker compose --env-file .env.dev up -d --build
#   npm run deploy prod
# VITE_* are build-time (baked into the bundle), so each env is its own build.
name: sous-web-${ENV:-dev}

services:
  web:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: sous-web:${ENV:-dev}
    container_name: sous_web_${ENV:-dev}_app
    restart: unless-stopped
    expose:
      - '80'
    # localhost-only host port for on-server smoke tests; the public path is the tunnel.
    ports:
      - '127.0.0.1:${WEB_PORT:-8082}:80'
    networks:
      - sous_web_net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3

  # Bundled Cloudflare Tunnel. In Zero Trust, point the public hostname's ingress
  # at the app over this shared network: http://sous_web_${ENV}_app:80
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sous_web_${ENV:-dev}_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env.${ENV:-dev} # provides TUNNEL_TOKEN
    depends_on:
      - web
    networks:
      - sous_web_net

networks:
  sous_web_net:
    name: sous_web_${ENV:-dev}_net
