# Self-hosted deploy: static PWA served by nginx, exposed publicly through a
# bundled Cloudflare Tunnel. Put config in a .env file (Compose auto-loads it,
# so no --env-file flag is needed and VITE_* are never accidentally blank):
#   cp .env.deploy.example .env        # set VITE_* and CLOUDFLARE_TUNNEL_TOKEN
#   docker compose up -d --build
#
# Unique project / network / container names avoid clashes with other stacks.
name: sous-web

services:
  sous-web:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: sous-web:latest
    container_name: sous_web_app
    restart: unless-stopped
    expose:
      - "80"
    # Optional: localhost-only host port for testing on the server itself.
    # The public path is the Cloudflare Tunnel, not this port.
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - sous_web_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Bundled Cloudflare Tunnel. In Zero Trust, point the public hostname's
  # ingress at the app over this shared network: http://sous-web:80
  # (Prefer running cloudflared on the host? Remove this service and point that
  # tunnel at the published port http://127.0.0.1:8080 instead.)
  sous-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sous_web_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - sous-web
    networks:
      - sous_web_net

networks:
  sous_web_net:
    name: sous_web_net
